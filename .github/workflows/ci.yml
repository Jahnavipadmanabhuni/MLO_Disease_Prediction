name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # trains a model, boots the API, simulates drift, runs monitoring + gated retraining
      - name: Run test-suite
        run: pytest -q

      - name: Pipeline smoke run (train -> monitor drifted traffic) and keep the Evidently report
        run: |
          python -m src.data_gen --out data/raw/disease_data.csv
          python -m src.train
          python -m src.simulate_traffic --n 300 --drift 1.0 --reset
          python -m src.monitor
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: reports/

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t medpredict:${{ github.sha }} .
      - name: Smoke-test the image
        run: docker run --rm medpredict:${{ github.sha }} python -c "import src.api, src.monitor, src.retrain; print('image ok')"
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/medpredict
          docker tag medpredict:${{ github.sha }} $IMAGE:latest
          docker tag medpredict:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
